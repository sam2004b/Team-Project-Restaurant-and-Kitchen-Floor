
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Build and test .NET backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API
        run: dotnet restore backend/Restaurant.Api/Restaurant.Api.csproj

      - name: Build API
        run: dotnet build backend/Restaurant.Api/Restaurant.Api.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/Restaurant.Api.Tests/Restaurant.Api.Tests.csproj --configuration Release
