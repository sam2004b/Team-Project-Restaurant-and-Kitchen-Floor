
services:

  # PostgreSQL database
  db:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 3s
      retries: 12

  # ASP.NET Core backend
  api:
    build:
      context: ./backend/Restaurant.Api
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:5020:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"

      Database__ApplyMigrationsOnStartup: "true"

      Seed__DefaultPassword: ${SEED_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

        
    volumes:
      - dish_uploads:/app/wwwroot/images/uploads


volumes:
  postgres_data:
  dish_uploads:
